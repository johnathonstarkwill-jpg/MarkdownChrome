<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Markdown Chrome</title>
    <link rel="stylesheet" href="../../vendor/katex.min.css">
    <link rel="stylesheet" href="./viewer.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
  </head>
  <body>
    <header class="toolbar">
      <div class="file-meta">
        <strong id="fileName">Markdown Chrome</strong>
        <span id="status">Ready</span>
      </div>
      <div class="actions">
        <button id="newButton" type="button" title="New file (Cmd+N)" class="icon-btn icon-btn--accent" aria-label="New file">
          <i class="ti ti-file-plus" aria-hidden="true"></i>
        </button>
        <button id="openButton" type="button" title="Open Markdown file" class="icon-btn" aria-label="Open file">
          <i class="ti ti-folder-open" aria-hidden="true"></i>
        </button>
        <button id="openFolderButton" type="button" title="Open folder with Markdown files" class="icon-btn" aria-label="Open folder">
          <i class="ti ti-folders" aria-hidden="true"></i>
        </button>
        <button id="toggleFilesButton" type="button" title="Show or hide file tree" class="icon-btn" aria-label="Toggle file tree">
          <i class="ti ti-layout-sidebar" aria-hidden="true"></i>
        </button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button id="refreshButton" type="button" title="Refresh current file or folder" class="icon-btn" aria-label="Refresh">
          <i class="ti ti-refresh" aria-hidden="true"></i>
        </button>
        <button id="saveButton" type="button" title="Save to writable file" class="icon-btn" aria-label="Save">
          <i class="ti ti-device-floppy" aria-hidden="true"></i>
        </button>
        <button id="exportHtmlButton" type="button" title="Export rendered Markdown as HTML" class="icon-btn" aria-label="Export HTML">
          <i class="ti ti-brand-html5" aria-hidden="true"></i>
        </button>
        <button id="exportPdfButton" type="button" title="Export rendered Markdown as PDF through print dialog" class="icon-btn" aria-label="Export PDF">
          <i class="ti ti-file-type-pdf" aria-hidden="true"></i>
        </button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button id="themeToggleButton" type="button" title="Switch light or dark theme" class="icon-btn" aria-label="Toggle theme">
          <i class="ti ti-moon" aria-hidden="true"></i>
        </button>
        <label class="autosave-toggle" title="Auto-save">
          <input id="autosaveToggle" type="checkbox" checked aria-label="Auto-save">
          <span class="autosave-label">AS</span>
        </label>
        <div class="mode-group" aria-label="View mode">
          <button class="mode-button is-active" type="button" data-mode="split">Split</button>
          <button class="mode-button" type="button" data-mode="preview">Preview</button>
          <button class="mode-button" type="button" data-mode="editor">Editor</button>
        </div>
      </div>
    </header>

    <main id="appLayout" class="app-layout sidebar-collapsed">
      <button id="revealSidebarButton" class="reveal-sidebar-button" type="button" title="Show file tree">›</button>
      <aside id="sidebar" class="sidebar" aria-label="Markdown folder tree">
        <div class="sidebar-header">
          <strong id="folderName">Folder</strong>
          <button id="toggleSidebarButton" class="sidebar-arrow-button" type="button" title="Hide file tree">‹</button>
        </div>
        <div id="fileTree" class="file-tree" role="tree"></div>
        <div id="sidebarResizeHandle" class="sidebar-resize-handle" role="separator" aria-orientation="vertical" title="Resize file tree"></div>
      </aside>

      <section class="document-area">
        <div class="markdown-toolbar" aria-label="Markdown formatting tools">
          <button type="button" data-markdown-action="heading2" title="Heading">H2</button>
          <button type="button" data-markdown-action="bold" title="Bold">B</button>
          <button type="button" data-markdown-action="italic" title="Italic">I</button>
          <button type="button" data-markdown-action="link" title="Link">Link</button>
          <button type="button" data-markdown-action="quote" title="Quote">Quote</button>
          <button type="button" data-markdown-action="bulletedList" title="Bulleted list">List</button>
          <button type="button" data-markdown-action="numberedList" title="Numbered list">1.</button>
          <button type="button" data-markdown-action="codeBlock" title="Code block">Code</button>
          <button type="button" data-markdown-action="table" title="Table">Table</button>
          <button type="button" data-markdown-action="mermaid" title="Mermaid diagram">Mermaid</button>
        </div>

        <div id="workspace" class="workspace mode-split">
          <section class="pane editor-pane" aria-label="Markdown editor">
            <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
          </section>
          <section class="pane preview-pane" aria-label="Rendered preview">
            <article id="preview" class="markdown-body"></article>
          </section>
        </div>
      </section>
    </main>

    <script src="../../vendor/marked.min.js"></script>
    <script src="../../vendor/katex.min.js"></script>
    <script src="../../vendor/auto-render.min.js"></script>
    <script src="../../vendor/mermaid.min.js"></script>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
